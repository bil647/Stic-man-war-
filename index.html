<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Stickman War</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

body{
    font-family:Arial,sans-serif;
}

#scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        #dce6ee 0%,
        #f5f5f5 62%,
        #777 62%,
        #444 100%
    );
}

/* الأرض */

#ground{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:38%;

    background:
    repeating-linear-gradient(
        90deg,
        #555 0px,
        #555 40px,
        #505050 40px,
        #505050 80px
    );

    border-top:5px solid #222;
}

/* العنوان */

#title{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;

    font-size:25px;
    font-weight:bold;

    color:#222;
    z-index:5;
}

/* الوقت */

#timer{
    position:absolute;
    top:50px;
    width:100%;
    text-align:center;

    font-size:18px;
    color:#333;

    z-index:5;
}

/* زر البداية */

#start{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    padding:16px 35px;

    border:0;
    border-radius:12px;

    background:#111;
    color:white;

    font-size:20px;
    font-weight:bold;

    z-index:20;
}

/* الشخصية */

.fighter{

    position:absolute;

    width:80px;
    height:180px;

    bottom:38%;

    transform-origin:center bottom;

    z-index:10;

}

/* الرأس */

.head{

    position:absolute;

    width:42px;
    height:42px;

    left:19px;
    top:0;

    border-radius:50%;
}

/* الجسم */

.body{

    position:absolute;

    width:8px;
    height:75px;

    left:36px;
    top:40px;

    border-radius:10px;
}

/* الأطراف */

.limb{

    position:absolute;

    height:8px;

    border-radius:8px;

    transform-origin:left center;
}

/* الأسود */

#black .head,
#black .body,
#black .limb{

    background:#050505;
}

/* الأحمر */

#red .head,
#red .body,
#red .limb{

    background:#e00000;
}

/* الأذرع */

.arm1{
    width:68px;
    left:36px;
    top:55px;
    transform:rotate(145deg);
}

.arm2{
    width:68px;
    left:36px;
    top:55px;
    transform:rotate(35deg);
}

/* الأرجل */

.leg1{
    width:82px;
    left:36px;
    top:110px;
    transform:rotate(115deg);
}

.leg2{
    width:82px;
    left:36px;
    top:110px;
    transform:rotate(65deg);
}

/* تأثير الضربة */

.hit{

    position:absolute;

    font-size:42px;
    font-weight:900;

    color:#111;

    pointer-events:none;

    z-index:15;

    animation:
    hitAnimation .35s ease-out forwards;
}

@keyframes hitAnimation{

    0%{
        opacity:1;
        transform:scale(.5) rotate(-10deg);
    }

    50%{
        opacity:1;
        transform:scale(1.4) rotate(10deg);
    }

    100%{
        opacity:0;
        transform:scale(1.8) rotate(-10deg);
    }
}

/* خطوط السرعة */

.speed{

    position:absolute;

    width:100px;
    height:4px;

    background:#222;

    opacity:.7;

    z-index:2;

    animation:
    speedAnimation .25s linear forwards;
}

@keyframes speedAnimation{

    from{
        transform:translateX(0);
        opacity:.8;
    }

    to{
        transform:translateX(-250px);
        opacity:0;
    }

}

/* اهتزاز */

.shake{

    animation:
    shakeAnimation .12s linear;
}

@keyframes shakeAnimation{

    0%{
        transform:translate(0,0);
    }

    25%{
        transform:translate(8px,-5px);
    }

    50%{
        transform:translate(-8px,5px);
    }

    75%{
        transform:translate(5px,2px);
    }

    100%{
        transform:translate(0,0);
    }

}

/* النهاية */

#end{

    position:absolute;

    left:50%;
    top:40%;

    transform:translate(-50%,-50%) scale(.5);

    font-size:55px;
    font-weight:900;

    color:#111;

    opacity:0;

    z-index:30;

    pointer-events:none;

}

.showEnd{

    animation:
    endAnimation 2s ease-out forwards;
}

@keyframes endAnimation{

    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.2);
    }

    30%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.3);
    }

    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }

}

</style>
</head>


<body>

<div id="scene">

<div id="title">
BLACK VS RED
</div>

<div id="timer">
00:00
</div>


<button id="start">
ابدأ القتال
</button>


<!-- الأسود -->

<div id="black" class="fighter">

<div class="head"></div>

<div class="body"></div>

<div class="limb arm1"></div>

<div class="limb arm2"></div>

<div class="limb leg1"></div>

<div class="limb leg2"></div>

</div>


<!-- الأحمر -->

<div id="red" class="fighter">

<div class="head"></div>

<div class="body"></div>

<div class="limb arm1"></div>

<div class="limb arm2"></div>

<div class="limb leg1"></div>

<div class="limb leg2"></div>

</div>


<div id="end">
K.O!
</div>


<div id="ground"></div>

</div>


<script>

const scene =
document.getElementById("scene");

const black =
document.getElementById("black");

const red =
document.getElementById("red");

const start =
document.getElementById("start");

const timer =
document.getElementById("timer");

const end =
document.getElementById("end");


let running=false;

let startTime=0;

let lastSecond=-1;


/* تحريك الشخصية */

function move(
    fighter,
    x,
    jump=0,
    rotation=0,
    scale=1
){

    fighter.style.left=x+"%";

    fighter.style.bottom=
    "calc(38% + "+jump+"px)";

    fighter.style.transform=
    "rotate("+rotation+"deg) scale("+scale+")";

}


/* تأثير ضربة */

function hit(
    x,
    y,
    text="POW!"
){

    const element=
    document.createElement("div");

    element.className="hit";

    element.innerText=text;

    element.style.left=x+"%";

    element.style.top=y+"%";

    scene.appendChild(element);

    setTimeout(
        ()=>{
            element.remove();
        },
        400
    );

}


/* اهتزاز */

function shake(){

    scene.classList.remove("shake");

    void scene.offsetWidth;

    scene.classList.add("shake");

}


/* خطوط السرعة */

function speedLine(){

    const line=
    document.createElement("div");

    line.className="speed";

    line.style.left=
    (30+Math.random()*50)+"%";

    line.style.top=
    (25+Math.random()*40)+"%";

    scene.appendChild(line);

    setTimeout(
        ()=>{
            line.remove();
        },
        250
    );

}


/*
==================================
الحركات
==================================
*/


function animation(time){

    /*
    0 - 3
    اقتراب سريع
    */

    if(time<3){

        const p=time/3;

        move(
            black,
            15+p*25,
            0,
            -5
        );

        move(
            red,
            75-p*25,
            0,
            5
        );

    }


    /*
    3 - 6
    هجوم أسود
    */

    else if(time<6){

        const p=(time-3)/3;

        move(
            black,
            40+p*10,
            0,
            -20+p*40
        );

        move(
            red,
            55,
            Math.sin(p*Math.PI)*20,
            10
        );

    }


    /*
    6 - 9
    تفادي الأحمر
    */

    else if(time<9){

        const p=(time-6)/3;

        move(
            black,
            50,
            0,
            15
        );

        move(
            red,
            55+p*8,
            Math.sin(p*Math.PI)*80,
            -20
        );

    }


    /*
    9 - 12
    ركلة حمراء
    */

    else if(time<12){

        const p=(time-9)/3;

        move(
            red,
            63-p*10,
            Math.sin(p*Math.PI)*70,
            25
        );

        move(
            black,
            50-p*5,
            0,
            -15
        );

    }


    /*
    12 - 15
    لكمات سريعة
    */

    else if(time<15){

        const p=(time-12)/3;

        move(
            black,
            45+
            Math.sin(p*Math.PI*6)*5,
            0,
            p*720
        );

        move(
            red,
            52+
            Math.sin(p*Math.PI*6)*5,
            0,
            -p*720
        );

    }


    /*
    15 - 18
    قفزة الأسود
    */

    else if(time<18){

        const p=(time-15)/3;

        move(
            black,
            48,
            Math.sin(p*Math.PI)*150,
            p*360
        );

        move(
            red,
            55,
            0,
            0
        );

    }


    /*
    18 - 21
    الأحمر يقفز
    */

    else if(time<21){

        const p=(time-18)/3;

        move(
            black,
            48,
            0,
            0
        );

        move(
            red,
            53,
            Math.sin(p*Math.PI)*150,
            -p*360
        );

    }


    /*
    21 - 25
    قتال هوائي
    */

    else if(time<25){

        const p=(time-21)/4;

        move(
            black,
            45+p*8,
            100+
            Math.sin(p*Math.PI)*80,
            p*720
        );

        move(
            red,
            55-p*8,
            100+
            Math.sin(p*Math.PI)*80,
            -p*720
        );

    }


    /*
    25 - 28
    سقوط
    */

    else if(time<28){

        const p=(time-25)/3;

        move(
            black,
            53,
            100-p*100,
            180+p*90
        );

        move(
            red,
            47,
            100-p*100,
            -180-p*90
        );

    }


    /*
    28 - 32
    النهوض والهجوم
    */

    else if(time<32){

        const p=(time-28)/4;

        move(
            black,
            40+p*8,
            0,
            -20
        );

        move(
            red,
            55-p*5,
            0,
            15
        );

    }


    /*
    32 - 37
    قتال سريع جدا
    */

    else if(time<37){

        const p=(time-32)/5;

        move(
            black,
            45+
            Math.sin(p*Math.PI*10)*7,
            Math.abs(
                Math.sin(p*Math.PI*5)
            )*40,
            Math.sin(p*Math.PI*8)*40
        );

        move(
            red,
            53+
            Math.sin(p*Math.PI*10)*7,
            Math.abs(
                Math.cos(p*Math.PI*5)
            )*40,
            Math.sin(p*Math.PI*8)*-40
        );

    }


    /*
    37 - 42
    ركلات دوران
    */

    else if(time<42){

        const p=(time-37)/5;

        move(
            black,
            46+p*8,
            Math.sin(p*Math.PI)*80,
            p*1080
        );

        move(
            red,
            54-p*8,
            Math.sin(p*Math.PI)*80,
            -p*1080
        );

    }


    /*
    42 - 47
    مطاردة
    */

    else if(time<47){

        const p=(time-42)/5;

        move(
            black,
            35+p*20,
            0,
            Math.sin(p*Math.PI*8)*15
        );

        move(
            red,
            60-p*20,
            0,
            Math.sin(p*Math.PI*8)*-15
        );

    }


    /*
    47 - 52
    أسرع تبادل
    */

    else if(time<52){

        const p=(time-47)/5;

        move(
            black,
            48+
            Math.sin(p*Math.PI*12)*8,
            Math.abs(
                Math.sin(p*Math.PI*6)
            )*50,
            Math.sin(p*Math.PI*12)*60
        );

        move(
            red,
            52+
            Math.sin(p*Math.PI*12)*8,
            Math.abs(
                Math.cos(p*Math.PI*6)
            )*50,
            Math.sin(p*Math.PI*12)*-60
        );

    }


    /*
    52 - 56
    الضربة النهائية
    */

    else if(time<56){

        const p=(time-52)/4;

        move(
            black,
            45+p*12,
            Math.sin(p*Math.PI)*50,
            0
        );

        move(
            red,
            55,
            Math.sin(p*Math.PI)*20,
            0
        );

    }


    /*
    56 - 60
    النهاية
    */

    else{

        move(
            black,
            57,
            0,
            -10
        );

        move(
            red,
            65,
            0,
            90
        );

    }

}


/* المؤثرات */

function effects(second){

    const attacks=[

        4,
        7,
        10,
        13,
        16,
        19,
        22,
        26,
        30,
        34,
        38,
        41,
        44,
        48,
        49,
        50,
        53,
        55

    ];


    if(
        attacks.includes(second)
        &&
        second!==lastSecond
    ){

        lastSecond=second;

        hit(
            45+Math.random()*10,
            30+Math.random()*25,
            second===55
            ?"BOOM!"
            :"POW!"
        );

        shake();

        for(
            let i=0;
            i<3;
            i++
        ){

            setTimeout(
                speedLine,
                i*50
            );

        }

    }


    if(second===56){

        end.classList.add("showEnd");

    }

}


/* الحلقة الرئيسية */

function loop(){

    if(!running)return;

    const elapsed=
    (Date.now()-startTime)/1000;

    const time=
    Math.min(elapsed,60);

    const seconds=
    Math.floor(time);

    timer.innerText=
    "00:"+
    String(seconds).padStart(2,"0");

    animation(time);

    effects(seconds);


    if(time<60){

        requestAnimationFrame(loop);

    }else{

        running=false;

        start.style.display="block";

        start.innerText=
        "إعادة القتال";

    }

}


/* البداية */

start.onclick=function(){

    running=true;

    start.style.display="none";

    end.classList.remove("showEnd");

    lastSecond=-1;

    startTime=Date.now();

    loop();

};

</script>

</body>
</html>
